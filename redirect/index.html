<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>タダカヨ村ゲーム — 新 URL へ移動中</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://tadakayo-game-yh.web.app/" />
    <link rel="canonical" href="https://tadakayo-game-yh.web.app/" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffe2f7;
        color: #2a1a25;
        padding: 1.5rem;
        text-align: center;
        line-height: 1.7;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        font-size: 1.5rem;
        color: #e33535;
        margin: 0 0 1rem;
      }
      a {
        color: #e33535;
        font-weight: 600;
      }
      .note {
        font-size: 0.875rem;
        opacity: 0.7;
        margin-top: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #2a1a25;
          color: #ffe2f7;
        }
        a {
          color: #ffa3c8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>タダカヨ村ゲームは新 URL に移動しました</h1>
      <p>自動でリダイレクトされない場合は、下のリンクからアクセスしてください。</p>
      <p>
        <a href="https://tadakayo-game-yh.web.app/" rel="canonical">
          https://tadakayo-game-yh.web.app/
        </a>
      </p>
      <p class="note">
        旧 URL（github.io）は Firebase Hosting への移行に伴い、こちらのリダイレクトページに置き換わっています。
      </p>
    </main>
    <script>
      // meta refresh の fallback。JS 有効時は history に旧 URL を残さない。
      location.replace("https://tadakayo-game-yh.web.app/");
    </script>
  </body>
</html>
