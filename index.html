<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e33535" />
    <title>タダカヨ村 — タダカヨちゃんのDX大冒険</title>
    <meta name="description" content="NPO法人タダカヨ公式 3Dオープンワールドゲーム。タダカヨ村でミッションをクリアしながら介護DXの世界を冒険しよう！" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="ui-layer">
        <div id="title-screen" class="screen visible">
          <img class="title-logo-img" src="./assets/images/title-logo.png" alt="タダカヨ村" />
          <p class="title-subtitle">タダカヨちゃんのDX大冒険 — オープンワールド版</p>
          <div class="phase-tag">Phase 5-B プロトタイプ（タダカヨ村）</div>
          <button id="start-button" class="primary-button" type="button">スタート</button>
          <button id="mute-toggle" class="mute-button" type="button">🔊 音 ON</button>
          <div class="title-hint">
            <strong>PC 操作:</strong><br />
            WASD / 矢印 で移動 ・ Space でジャンプ ・ E でアクション<br />
            <strong>マウスクリックで視点ロック</strong>、マウス移動で視点回転 ・ Shift で走る<br />
            （Esc で視点ロック解除）
          </div>
        </div>
        <div id="hud" class="hud hidden">
          <div class="hud-pill"><span class="hud-label">座標</span><span id="hud-position">x:0 y:0 z:0</span></div>
          <div class="hud-pill hud-hint">クリックして視点ロック → WASD 移動 / Space ジャンプ</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
