<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e33535" />
    <title>タダカヨ ランナー — タダカヨちゃんのDX大冒険</title>
    <meta name="description" content="NPO法人タダカヨ公式 3Dランナーゲーム。タダカヨちゃんと一緒に介護DXの旅路を駆け抜けよう！" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="ui-layer">
        <div id="title-screen" class="screen visible">
          <img class="title-logo-img" src="./assets/images/title-logo.png" alt="タダカヨ ランナー" />
          <p class="title-subtitle">タダカヨちゃんのDX大冒険</p>
          <div class="title-highscore-pill">
            <span>ハイスコア</span><strong id="title-highscore">0</strong>
          </div>
          <div class="settings-block">
            <label class="settings-label">難易度</label>
            <div id="difficulty-buttons" class="difficulty-buttons">
              <button type="button" class="diff-btn" data-difficulty="easy">やさしい</button>
              <button type="button" class="diff-btn active" data-difficulty="normal">ふつう</button>
              <button type="button" class="diff-btn" data-difficulty="hard">むずかしい</button>
            </div>
          </div>
          <button id="start-button" class="primary-button" type="button">スタート</button>
          <button id="mute-toggle" class="mute-button" type="button">🔊 音 ON</button>
          <p class="title-hint">
            ← → / A・D で移動 ・ Space / ↑ でジャンプ ・ ↓ でしゃがむ<br />
            モバイル: タップ&スワイプ（上=ジャンプ／下=しゃがむ／中央左右=レーン）
          </p>
        </div>
        <div id="hud" class="hud hidden">
          <div class="hud-row hud-row-top">
            <div class="hud-item"><span class="hud-label">スコア</span><span id="hud-score">0</span></div>
            <div class="hud-item hud-stage-pill"><span class="hud-label">ステージ</span><span id="hud-stage">現場</span></div>
            <div class="hud-item"><span class="hud-label">距離</span><span id="hud-distance">0</span><span class="hud-unit">m</span></div>
          </div>
          <div class="hud-row hud-row-bottom">
            <div id="hud-combo" class="hud-combo"><span class="hud-label">コンボ</span><span id="hud-combo-value">0</span><span id="hud-multiplier" class="hud-multiplier">×1</span></div>
            <div id="hud-shield" class="hud-shield">
              <span class="hud-label">シールドゲージ</span>
              <div class="shield-bar"><div id="hud-streak" class="shield-fill">0/5</div></div>
            </div>
          </div>
        </div>
        <div id="stage-flash" class="stage-flash"></div>
        <div id="combo-burst" class="combo-burst"></div>
        <div id="tutorial-tip" class="tutorial-tip"></div>
        <div id="result-screen" class="screen hidden">
          <h2 class="result-title">ありがとう！</h2>
          <div class="result-stats">
            <div><span>スコア</span><strong id="result-score">0</strong></div>
            <div><span>距離</span><strong id="result-distance">0m</strong></div>
            <div><span>最高コンボ</span><strong id="result-combo">0</strong></div>
            <div><span>到達ステージ</span><strong id="result-stage">現場</strong></div>
            <div><span>ハイスコア</span><strong id="result-highscore">0</strong></div>
          </div>
          <button id="retry-button" class="primary-button" type="button">もう一度</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
