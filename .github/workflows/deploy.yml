name: Build & Type Check

# Stage 3 / 2026-05-13: GitHub Pages デプロイから Firebase Hosting に移行したため、
# 本 workflow は **PR の build 検証のみ** を担当する。
# main push 時の本番 deploy は `firebase-hosting.yml` が担う (Stage 4 / 2026-05-13)。
#
# セキュリティ注意: 本 workflow は github.event.* の信頼できない入力 (issue title, PR body,
# commit message 等) を `run:` 内で直接展開しない設計。将来 deploy step を追加する際も、
# 信頼できない入力は env: 経由で受け取り `"$VAR"` の形でクォートして使うこと。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (verify only, no deploy)
        # 本番デプロイは `firebase-hosting.yml` が main push 時に Secrets を注入して
        # 実行する。本 step は VITE_FIREBASE_* 無しで build が通ることを検証する
        # (FirebaseService が null を返し localStorage 単独動作にフォールバックする
        # グレースフルデグレード設計)。
        run: npm run build
